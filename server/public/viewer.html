<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Test viewer</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css" />
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
  <!-- Mind map rendering (the same library the Lovable app uses) -->
  <script defer src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/markmap-view@0.18.12/dist/browser/index.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/markmap-lib@0.18.12/dist/browser/index.iife.js"></script>
  <style>
    :root { --bg: oklch(0.992 0.008 85); --ink: oklch(0.27 0.06 30); --muted: oklch(0.47 0.04 35); --line: oklch(0.32 0.08 28 / 0.14);
      --idiom: oklch(0.5 0.1 10); --term: oklch(0.45 0.1 265); --accent: oklch(0.32 0.08 28); }
    @media all { :root.dark { --bg: oklch(0.225 0.014 250); --ink: oklch(0.93 0.008 85); --muted: oklch(0.74 0.015 250);
      --line: oklch(0.36 0.014 250); --idiom: oklch(0.8 0.12 65); --term: oklch(0.8 0.1 260); --accent: oklch(0.78 0.1 200); } }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 "Atkinson Hyperlegible", system-ui, sans-serif; }
    header { position: sticky; top: 0; z-index: 1; background: var(--bg); border-bottom: 1px solid var(--line); padding: 8px 16px; font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    header select, header button { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; min-height: 32px; }
    header button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
    .tabs { display: flex; gap: 6px; }
    #feed { padding: 8px 16px 40px; display: grid; gap: 10px; }
    .caption.partial { color: var(--muted); font-style: italic; }
    .note { font-size: 14px; margin: 2px 0 0 12px; }
    .note.idiom b { color: var(--idiom); } .note.term b { color: var(--term); }
    .board { border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
    .board img { max-width: 160px; float: right; margin-left: 10px; border-radius: 4px; }
    .board::after { content: ""; display: block; clear: both; }
    .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    .mapline { font-size: 13px; color: var(--muted); }
    .mapline button { font: inherit; color: var(--accent); background: none; border: 0; padding: 0; text-decoration: underline; cursor: pointer; }
    pre { margin: 8px 16px; white-space: pre-wrap; font-size: 13px; }
    /* Per-student filter: hide notes below the chosen confusion level. */
    #feed.min-2 .note[data-level="1"],
    #feed.min-3 .note[data-level="1"],
    #feed.min-3 .note[data-level="2"] { display: none; }
    #mindmap { display: block; width: 100%; height: calc(100vh - 50px); min-height: 360px; --markmap-text-color: var(--ink); --markmap-circle-open-bg: var(--bg); }
    #mapEmpty { padding: 16px; color: var(--muted); }
  </style>
</head>
<body>
<header>
  <span id="status">Connecting…</span>
  <span id="focus" style="color: var(--accent); font-weight: 600"></span>
  <span class="tabs">
    <button id="tabFeed" aria-pressed="true">Feed</button>
    <button id="tabMap" aria-pressed="false">Mind map</button>
  </span>
  <label>My explanations
    <select id="minLevel">
      <option value="1">Everything</option>
      <option value="2">Standard</option>
      <option value="3">Only tricky ones</option>
    </select>
  </label>
</header>
<main>
  <div id="feed"></div>
  <section id="mapPanel" hidden>
    <p id="mapEmpty">No mind map yet. It appears after the teacher has said about 15 words (updates every ~45 s).</p>
    <svg id="mindmap" aria-label="Lecture mind map"></svg>
    <pre id="mapFallback" hidden></pre>
  </section>
</main>
<script>
  // Bare-bones student view for testing the server before the Lovable app is wired up.
  const $ = (id) => document.getElementById(id);
  const feed = $("feed");
  const status = $("status");
  let count = 0;
  let captions = new Map();
  let retry = 500;

  // Each student picks how many explanations they see. Filtering happens on the phone,
  // so it costs nothing and doesn't change what anyone else sees.
  $("minLevel").onchange = () => (feed.className = `min-${$("minLevel").value}`);

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function renderMath(target, latex, plain) {
    if (window.katex) katex.render(latex, target, { throwOnError: false, displayMode: true });
    else target.textContent = plain ?? latex;
  }

  // Text lines can contain inline maths in $…$; render those parts with KaTeX, the rest as text.
  function renderText(target, content, plain) {
    if (!window.katex) return void (target.textContent = plain ?? content);
    content.split(/(?<!\\)\$([^$]+)\$/).forEach((part, i) => {
      if (i % 2 === 0) target.append(part);
      else {
        const span = document.createElement("span");
        katex.render(part, span, { throwOnError: false });
        target.append(span);
      }
    });
  }

  // ---------- Mind map tab ----------
  // The server sends the whole outline as Markdown each time; markmap draws it as a tree.
  // It's only drawn while the tab is visible (an SVG can't be laid out while hidden).

  let latestMap = null;
  let mapDirty = false;

  // "You are here": the topic the teacher is on, by id from the latest mind map.
  let topicLabels = new Map();
  let focusId = null;
  function showFocus() {
    const label = topicLabels.get(focusId);
    $("focus").textContent = label ? `● Now: ${label}` : "";
  }
  let mm = null;
  let transformer = null;

  function showTab(map) {
    $("mapPanel").hidden = !map;
    feed.hidden = map;
    $("tabMap").setAttribute("aria-pressed", String(map));
    $("tabFeed").setAttribute("aria-pressed", String(!map));
    $("tabMap").textContent = "Mind map";
    if (map) {
      if (mapDirty) renderMap();
      else mm?.fit();
    }
  }
  $("tabFeed").onclick = () => showTab(false);
  $("tabMap").onclick = () => showTab(true);

  function renderMap() {
    if (!latestMap) return;
    mapDirty = false;
    $("mapEmpty").hidden = true;
    const lib = window.markmap;
    if (!lib?.Markmap || !lib?.Transformer) {
      // Library didn't load (offline?): show the outline as text instead.
      $("mapFallback").hidden = false;
      $("mapFallback").textContent = latestMap;
      return;
    }
    transformer ??= new lib.Transformer();
    const { root } = transformer.transform(latestMap);
    mm ??= lib.Markmap.create($("mindmap"), { duration: 300, maxWidth: 260 });
    Promise.resolve(mm.setData(root)).then(() => mm.fit());
  }
  window.addEventListener("load", () => !$("mapPanel").hidden && renderMap());

  function resetMap() {
    latestMap = null;
    mapDirty = false;
    mm?.destroy?.();
    mm = null;
    $("mindmap").replaceChildren();
    $("mapEmpty").hidden = false;
    $("mapFallback").hidden = true;
  }

  // ---------- Events ----------

  function handle(event) {
    count++;
    if (event.type === "caption") {
      let entry = captions.get(event.id);
      if (!entry) {
        entry = { box: el("div"), text: el("div", "caption") };
        entry.box.append(entry.text);
        captions.set(event.id, entry);
        feed.append(entry.box);
      }
      entry.text.textContent = event.text;
      entry.text.className = event.final ? "caption" : "caption partial";
    } else if (event.type === "annotation") {
      const entry = captions.get(event.captionId);
      const note = el("div", `note ${event.kind}`);
      note.dataset.level = String(event.level ?? 2);
      note.append(
        el("b", "", `${event.kind === "idiom" ? "Idiom" : "Term"}: “${event.phrase}”`),
        ` — ${event.meaning} `,
        el("span", "label", `level ${event.level ?? "?"}`),
      );
      (entry ? entry.box : feed).append(note);
    } else if (event.type === "board") {
      const card = el("div", "board");
      card.append(el("div", "label", "Board (AI transcribed)"));
      const img = el("img");
      img.src = event.snapshotUrl;
      img.alt = "Whiteboard photo";
      card.append(img);
      for (const block of event.blocks) {
        const row = el("div");
        if (block.kind === "equation") renderMath(row, block.content, block.plain);
        else renderText(row, block.content, block.plain);
        if (block.spoken) row.setAttribute("aria-label", block.spoken);
        card.append(row);
      }
      feed.append(card);
    } else if (event.type === "focus") {
      focusId = event.topicId;
      showFocus();
    } else if (event.type === "lost") {
      const s = Math.floor(event.t / 1000);
      const where = topicLabels.get(event.topicId);
      feed.append(el("div", "mapline", `⚑ A student is lost at ${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}${where ? ` (${where})` : ""}`));
    } else if (event.type === "addressed") {
      const where = topicLabels.get(event.topicId);
      feed.append(el("div", "mapline", `✓ Your teacher went over ${where ? `“${where}”` : "what students were lost on"}`));
    } else if (event.type === "mindmap") {
      topicLabels = new Map((event.topics ?? []).map((t) => [t.id, t.label]));
      showFocus();
      latestMap = event.markdown;
      const topics = (event.markdown.match(/^## /gm) ?? []).length;
      const line = el("div", "mapline", `Mind map updated · ${topics} topic${topics === 1 ? "" : "s"} · `);
      const view = el("button", "", "View");
      view.onclick = () => showTab(true);
      line.append(view);
      feed.append(line);
      if ($("mapPanel").hidden) {
        mapDirty = true;
        $("tabMap").textContent = "Mind map •";
      } else {
        renderMap();
      }
    }
    status.textContent = `Live · ${count} events`;
    if (!feed.hidden) window.scrollTo(0, document.body.scrollHeight);
  }

  function connect() {
    // Embedded in the teacher console (?preview=1): don't count as a student.
    const role = new URLSearchParams(location.search).has("preview") ? "?role=preview" : "";
    const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws${role}`);
    ws.onopen = () => {
      // The server re-sends the whole lecture on every connect, so start from a clean slate.
      feed.replaceChildren();
      captions = new Map();
      count = 0;
      retry = 500;
      resetMap();
      topicLabels = new Map();
      focusId = null;
      showFocus();
      status.textContent = "Live · waiting for events";
    };
    ws.onmessage = (e) => handle(JSON.parse(e.data));
    ws.onclose = () => {
      status.textContent = "Reconnecting…";
      setTimeout(connect, retry);
      retry = Math.min(retry * 2, 8000);
    };
  }
  connect();
</script>
</body>
</html>
